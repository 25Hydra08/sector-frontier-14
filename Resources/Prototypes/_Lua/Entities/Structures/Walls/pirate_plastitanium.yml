- type: entity
  parent: WallPlastitanium
  id: WallPlastitaniumRust
  name: plastitanium wall
  suffix: rusted
  description: A plastitanium wall eaten through by rust. Good enough for pirates.
  components:
  - type: Sprite
    sprite: _Lua/Structures/Walls/PiratePlastitaniumWall.rsi
  - type: Icon
    sprite: _Lua/Structures/Walls/PiratePlastitaniumWall.rsi
  - type: IconSmooth
    key: walls
    base: pirateplastitanium
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrongRust
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2900
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 3200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

