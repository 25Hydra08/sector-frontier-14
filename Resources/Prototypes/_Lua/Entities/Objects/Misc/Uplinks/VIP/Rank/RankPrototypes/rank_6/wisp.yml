- type: entity
  parent:
  - RankWispBase
  - BaseStorageItem
  id: MobRankWisp6
  name: висп VI ранга
  description: Странный светящийся шар, который следует за своим владельцем. Выдается за выслугу.
  components:
  - type: Sprite
    noRot: true
    sprite: _Lua/RankEntities/RankWispBase.rsi
    layers:
    - state: icon
      shader: unshaded
      color: "#d32be0"
    - state: icon-glow
      shader: unshaded
      color: "#d32be0"
  - type: Item
    sprite: _Lua/RankEntities/RankWispBase.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
        color: "#d32be0"
      right:
      - state: inhand-right
        shader: unshaded
        color: "#d32be0"
  - type: PointLight
    energy: 3
    radius: 5
    color: "#d32be0"
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,3,3
    storageOpenSound:
      collection: WispInteract
      params:
        variation: 0.125
    storageCloseSound:
      collection: WispInteract
      params:
        variation: 0.125
    storageInsertSound:
      collection: WispInteract
      params:
        variation: 0.125
    storageRemoveSound:
      collection: WispInteract
      params:
        variation: 0.125
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
