- type: entity
  parent:
  - RankWispBase
  - BaseStorageItem
  id: MobRankWisp9
  name: висп IX ранга
  description: Странный светящийся шар, который следует за своим владельцем. Выдается за выслугу.
  components:
  - type: Sprite
    noRot: true
    sprite: _Lua/RankEntities/RankWispBase.rsi
    layers:
    - state: icon
      shader: unshaded
      color: "#3c2470"
    - state: icon-glow
      shader: unshaded
      color: "#3c2470"
  - type: Item
    sprite: _Lua/RankEntities/RankWispBase.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
        color: "#3c2470"
      right:
      - state: inhand-right
        shader: unshaded
        color: "#3c2470"
  - type: PointLight
    energy: 3
    radius: 5
    color: "#3c2470"
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1
    storageOpenSound:
      collection: WispInteract
      params:
        variation: 0.125
    storageCloseSound:
      collection: WispInteract
      params:
        variation: 0.125
    storageInsertSound:
      collection: WispInteract
      params:
        variation: 0.125
    storageRemoveSound:
      collection: WispInteract
      params:
        variation: 0.125
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
